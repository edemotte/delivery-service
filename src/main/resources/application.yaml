server:
  port: 8081

spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: delivery_service_user
    password: deliveryroot

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: delivery-service-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.kafka400.delivery_service.event"
        spring.json.value.default.type: "com.kafka400.delivery_service.event.OrderCreatedEvent"
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      order-created: order-created.v1